name: Fixture TCP protocol E2E

on:
  pull_request:
    paths:
      - tests/fixture-protocol.e2e.test.mjs
      - .github/workflows/fixture-tcp-e2e.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check fixture transport test syntax
        run: node --check tests/fixture-protocol.e2e.test.mjs
      - name: Execute real loopback TCP and concurrent browser-fixture journeys
        run: node --test tests/fixture-protocol.e2e.test.mjs
