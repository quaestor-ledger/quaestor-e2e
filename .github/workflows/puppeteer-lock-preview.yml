name: one-shot Puppeteer lock finalizer

on:
  push:
    branches:
      - agent/isolate-opto-sync-credentials-20260810
    paths:
      - package.json
      - .github/workflows/puppeteer-lock-preview.yml

permissions:
  contents: write

concurrency:
  group: one-shot-puppeteer-lock-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor == 'ORESoftware' &&
      github.repository == 'quaestor-ledger/quaestor-ledger-e2e' &&
      github.ref == 'refs/heads/agent/isolate-opto-sync-credentials-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Generate and verify the exact audited lock without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact puppeteer@25.1.0
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run test:contract
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages ?? {};
          if (packages['node_modules/js-yaml'] || packages['node_modules/cosmiconfig']) {
            throw new Error('vulnerable cosmiconfig/js-yaml dependency path remains');
          }
          if (packages['node_modules/puppeteer']?.version !== '25.1.0') {
            throw new Error('Puppeteer lock is not exact 25.1.0');
          }
          NODE
      - name: Commit the verified lock and remove this one-shot workflow
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents"
          branch="agent/isolate-opto-sync-credentials-20260810"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_WRITE_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          lock_sha="$(curl --fail --silent --show-error "${headers[@]}" \
            "${api}/package-lock.json?ref=${branch}" | jq -r .sha)"
          jq -n \
            --arg message 'fix(deps): commit audited Puppeteer 25.1.0 lock' \
            --arg content "$(base64 -w0 package-lock.json)" \
            --arg sha "$lock_sha" \
            --arg branch "$branch" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' \
            > "$RUNNER_TEMP/lock-payload.json"
          curl --fail --silent --show-error -X PUT "${headers[@]}" \
            "${api}/package-lock.json" \
            --data-binary @"$RUNNER_TEMP/lock-payload.json" >/dev/null

          workflow_path='.github/workflows/puppeteer-lock-preview.yml'
          workflow_sha="$(curl --fail --silent --show-error "${headers[@]}" \
            "${api}/${workflow_path}?ref=${branch}" | jq -r .sha)"
          jq -n \
            --arg message 'chore(ci): remove one-shot lock finalizer' \
            --arg sha "$workflow_sha" \
            --arg branch "$branch" \
            '{message:$message,sha:$sha,branch:$branch}' \
            > "$RUNNER_TEMP/delete-payload.json"
          curl --fail --silent --show-error -X DELETE "${headers[@]}" \
            "${api}/${workflow_path}" \
            --data-binary @"$RUNNER_TEMP/delete-payload.json" >/dev/null
