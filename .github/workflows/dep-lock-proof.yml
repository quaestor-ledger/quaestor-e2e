name: Regenerate audited browser lockfile
on:
  pull_request:
    paths:
      - ".github/workflows/dep-lock-proof.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Resolve patched Puppeteer and regenerated immutable lockfile
        run: npm install puppeteer@25.16.0 --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact
      - name: Emit public dependency metadata for audited source update
        run: |
          echo 'BEGIN_QUAESTOR_PACKAGE_JSON'
          cat package.json
          echo 'END_QUAESTOR_PACKAGE_JSON'
          echo 'BEGIN_QUAESTOR_PACKAGE_LOCK'
          cat package-lock.json
          echo 'END_QUAESTOR_PACKAGE_LOCK'
      - name: Validate clean install
        run: npm ci --ignore-scripts
      - name: Enforce dependency security audit
        run: npm audit --audit-level=high
      - name: Exercise contract suite with patched dependencies
        run: npm run test:contract
