name: Ledger atomicity bounded model
on:
  pull_request:
    paths:
      - 'formal/ledger-atomicity/**'
      - '.github/workflows/ledger-atomicity-model.yml'
  workflow_dispatch:
jobs:
  finite-model:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node formal/ledger-atomicity/model.cjs
